<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeatingArrangement</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root { --primary: #2563eb; --success: #059669; --purple: #7c3aed; --bg: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; }

        .master-container { width: 100%; }
        
        .no-print-area { max-width: 700px; margin: 0 auto 30px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .controls { display: flex; flex-direction: column; gap: 12px; }
        .input-row { display: flex; gap: 20px; flex-wrap: wrap; text-align: center; }
        .input-field { flex: 3; min-width: 140px; width: 50px; }
        label { font-size: 12px; font-weight: bold; display: block; margin-bottom: 4px; }
        input, select, button { padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; width: 100%; box-sizing: border-box; }
        .input-exam { flex: 1; min-width: 80px; width: 20%;}

        .btn-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 5px; }
        .upload-group { display: flex; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 5px;align-items: center; }
        .btn-card { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-master { background: #334155; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-sticker { background: var(--purple); color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-clear { background: #ec3636; color: white; border: none; font-weight: bold; cursor: pointer; width: 100%; height: 100%; }

        
        #pdfBtn { background: var(--success); color: white; border: none; font-weight: bold; cursor: pointer; display: none; margin-top: 15px; }

        /* Hall Card Styles */
        .class-card { 
    width: 190mm; 
    min-height: 45mm; /* Changed from height to min-height */
    height: auto;      /* Allows expansion */
    
    margin: 0 auto 5mm; /* Increased margin for better separation */
    box-sizing: border-box; 
    display: flex; 
    flex-direction: column; 
    background: #fff; 
    page-break-inside: avoid;
    border: 0.75pt solid #000;
     /* Prevents a single card from splitting across pages */
}
        .class-header { background: #f8fafc; padding: 5px 15px; border-bottom: 2.5px solid #000; display: flex; justify-content: space-between; align-items: center; }
        .header-main { display: flex; align-items: center; gap: 15px; }
        .session-info { font-size: 12px; font-family: monospace; display: flex; flex-direction: column; align-items: center; line-height: 1.1; border-left: 1px solid #ccc; padding-left: 10px; }
        .card-body { padding: 8px 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .range-numbers { font-family: 'Calibri', monospace; font-size: 20px; font-weight: 900; }
        .paper-label { font-size: 11px; font-weight: 900; text-transform: capitalize; border-bottom: 1.5px solid #000; width: fit-content; margin-bottom: 2px;font-family:'Calibri' }

        /* Master Table Styles */
       /* Optimized Master Table for Landscape Print */
.master-table { 
    width: 100%; 
    border-collapse: collapse; 
    table-layout: fixed; /* Crucial for respecting set widths */
    background: #fff; 
}

.master-table th{ 
    border: 1px solid #000; 
    padding: 6px 4px; 
    text-align: center; 
    font-weight: 700; 
    font-size: 13px;
    word-wrap: break-word; /* Prevents long text from breaking layout */
}
.master-table td { 
    border: 1px solid #000; 
    padding: 6px 4px; 
    text-align: left; 
    font-weight: 700; 
    font-size: 13px;
    word-wrap: break-word; /* Prevents long text from breaking layout */
}

/* Specific Column Widths */
.col-hall { width: 4%; text-align: right; }        /* Reduced Hall column */
/* .col-date { width: 8%; text-align: center;}       Reduced Date/Session column */
.col-paper { width: 25%; }      /* EXPANDED Paper column */
.col-regs-master { width: 35%; } /* Register Numbers */
.col-str { width: 5%; }         /* Reduced Strength column */
.col-inv { width: 13%; }        /* Invigilator name */
.col-sign { width: 10%; }       /* Signature */
        
        .dotted-line { border-bottom: 1.5px dotted #000; height: 18px; width: 80%; margin: 0 auto; }

        /* Sticker Styles */
        .sticker-grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 22.84mm; width: 210mm; margin: 0 auto; background: #fff; }
        .sticker { display: flex; align-items: center; justify-content: center; font-family: 'Calibri', sans-serif; font-size: 20px; font-weight: 900; text-align: center; border: 0.1mm none #eee; overflow: hidden; }

        /* .cut-line { width: 190mm; margin: 2mm auto; border-top: 1px dashed #000; position: relative; } */
        .page-break { page-break-after: always; }
        @page {
        size: A4;
        margin: 10mm; /* Professional standard margin */
        }

       @media print {
    /* Hide UI elements */
    .no-print-area { display: none !important; }
    .landscape-print {
        @page { size: A4 landscape; margin: 10mm; }
        width: 100%;
    }

    /* Ensure the table fills the landscape width */
    .master-table {
        width: 100% !important;
        page-break-inside: auto;
    }
    
    /* Reset body for physical paper */
    body { 
        background: white !important; 
        padding: 0 !important; 
        margin: 0 !important; 
    }

    /* Force background colors and sharp borders */
    * { 
        -webkit-print-color-adjust: exact !important; 
        print-color-adjust: exact !important; 
        
    }

    /* Optimization for Master Table if it's long */
    .master-table {
        page-break-inside: auto;
    }
    .master-table tr {
        page-break-inside: avoid;
        page-break-after: auto;
    }
}

/* Make selects and inputs look more uniform */
select, input {
    padding: 5px;
    border: 1px solid #ccc;
    border-radius: 4px;
}


/* Make selects and inputs look more uniform */
select, input {
    padding: 5px;
    border: 1px solid #ccc;
    border-radius: 4px;
}
    </style>
</head>
<body>


     
    <div class="no-print-area" style="font-family: sans-serif; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
    <h2 style="margin: 0 0 20px 0; text-align: center;">Examination Seating Arrangement</h2>
    <div class="controls">


    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <label>Name of Exam:</label>
        <select class="input-exam" id="examName">
            <option value="First Semester">First Sem</option>
            <option value="Second Semester">Second Sem</option>
            <option value="Third Semester">Third Sem</option>
            <option value="Fourth Semester">Fourth Sem</option>
            <option value="Fifth Semester">Fifth Sem</option>
            <option value="Sixth Semester">Sixth Sem</option>
            <option value="Seventh Semester">Seventh Sem</option>
            <option value="Eighth Semester">Eighth Sem</option>

        </select>

        <label>Scheme:</label>
        <select id="examScheme" class="input-exam"> 
           <option value="FYUG">FYUG</option> 
           <option value="FYUG/CBCSS">FYUG/CBCSS</option>
           <option value="CBCSS">CBCSS</option> 
           
           <option value="PG">PG</option> 
        </select>

        <span>Examination</span>

        <select id="examSession" class="input-exam">
            <option>November</option>
            <option>April</option>
        </select>

        <input type="number" id="examYear" value="2026" class="input-exam">
    </div>
</div>
<br>

    
    
   

        <div class="input-row">
            
        </div>
        
        <div class="upload-group">
        <div css="input-field">
            <label><span> Students in a Hall: </span> </label></div>
           <div> <input type="number" id="pageSize" value="20">
        </div>
        <div>
        <input type="file" id="fileInput" accept=".xlsx, .xls" multiple></div>
        <div>
        <button class="btn-clear" onclick="clearAll()">Clear files</button></div>
        
         
        
        </div>
        <br>
        <div class="btn-group">
            <button class="btn-card" onclick="process('cards')">Seating Arrangement</button>
            <button class="btn-master" onclick="process('master')">Exam Table</button>
            <button class="btn-sticker" onclick="process('stickers')">Stickers</button>
            <button style="background: #0891b2; color: white; border: none; font-weight: bold; cursor: pointer;" onclick="process('summary')">Hall Summary</button>
        </div>
        <br>
        <button id="pdfBtn" onclick="downloadPDF()">Print</button>
    </div>
</div>

<div id="printableArea">
    
    <div id="dynamicOutput">

    </div>
</div>

<script>
    let currentMode = '';

    function parseId(id) {
        const str = String(id).trim();
        const match = str.match(/^([a-zA-Z]*)(\d+)$/);
        return match ? { prefix: match[1], num: match[2], val: parseInt(match[2]) } : { prefix: '', num: str, val: NaN };
    }
    function clearAll() {
        document.getElementById('fileInput').value = "";
        document.getElementById('dynamicOutput').innerHTML = "";
        document.getElementById('pdfBtn').style.display = "none";
        currentMode = '';
    }

    async function loadData() {
    const fileInput = document.getElementById('fileInput');
    if (!fileInput.files.length) { alert("Please select Excel files."); return null; }
    
    let list = [];
    for (const file of Array.from(fileInput.files)) {
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data);
        const sheet = wb.Sheets[wb.SheetNames[0]];

        // Extract Subject (B5) and Date/Time String (B6)
        const paperName = sheet['B5'] ? String(sheet['B5'].v).trim() : "Unknown Paper";
        const excelDateTime = sheet['B6'] ? String(sheet['B6'].v).trim() : "";

        const rows = XLSX.utils.sheet_to_json(sheet, {header: 1});
        
        // Process data starting from Row 9 (Index 8) in Column B (Index 1)
        const colBIndex = 1; 
        for(let r = 8; r < rows.length; r++) { 
            const regNumber = rows[r][colBIndex];
            if(regNumber) {
                // Store the excelDateTime along with the student info
                list.push({ id: regNumber, paper: paperName, dateTime: excelDateTime }); 
            }
        }
    }
    return list;
}

    async function process(mode) {
    currentMode = mode;
    const list = await loadData();
    if (!list || list.length === 0) return;
    
    const output = document.getElementById('dynamicOutput');
    output.innerHTML = '';
    
    if (mode === 'master') {
        document.body.classList.add('landscape-print');
    } else {
        document.body.classList.remove('landscape-print');
    }

    const pageSize = parseInt(document.getElementById('pageSize').value);
    
    if (mode === 'cards') {
    for (let i = 0, hCount = 1; i < list.length; i += pageSize, hCount++) {
        const chunk = list.slice(i, i + pageSize);
        renderHallCard(chunk, hCount, chunk[0].dateTime, "", "");
    }
} else if (mode === 'master') {
    renderMasterTable(list, pageSize);
} else if (mode === 'stickers') {
    renderStickers(list);
} else if (mode === 'summary') { // ADD THIS NEW CONDITION
    renderHallSummary(list, pageSize);
}
    document.getElementById('pdfBtn').style.display = 'block';
}



    function renderHallCard(chunk, num, date, session, time) {
    const output = document.getElementById('dynamicOutput');
    let bodyHtml = "";
    let groups = [];

    // 1. Grouping logic: Organize students by Paper
    chunk.forEach(item => {
        let lastG = groups[groups.length - 1];
        let obj = parseId(item.id);
        
        if (lastG && lastG.paper === item.paper && obj.prefix === lastG.lastObj.prefix && obj.val === lastG.lastObj.val + 1) {
            lastG.ranges[lastG.ranges.length - 1].end = obj;
            lastG.lastObj = obj;
            lastG.count++; // Increment count for this paper group
        } else {
            if (!lastG || lastG.paper !== item.paper) {
                // Initialize new paper group with count 1
                groups.push({ paper: item.paper, ranges: [{start: obj, end: obj}], lastObj: obj, count: 1 });
            } else {
                lastG.ranges.push({start: obj, end: obj});
                lastG.lastObj = obj;
                lastG.count++; // Increment count even if it's a new range within same paper
            }
        }
    });

    // 2. Format text: Full ID only for the first student of the paper
    groups.forEach(g => {
        let paperPrefix = ""; 
        
        let rText = g.ranges.map((r, index) => {
            let startStr = "";
            
            if (index === 0 || r.start.prefix !== paperPrefix) {
                startStr = r.start.prefix + r.start.num;
                paperPrefix = r.start.prefix; 
            } else {
                startStr = r.start.num;
            }
            
            if (r.start.num !== r.end.num) {
                let endStr = (r.end.num.length > 3 ? r.end.num.slice(-3) : r.end.num);
                return `${startStr}-${endStr}`;
            }
            return startStr;
        }).join(', ');
        
        // ADDED (${g.count}) to the paper label line
        bodyHtml += `
            <div style="margin-bottom: 8px;">
                <div class="paper-label">${g.paper} <style="font-size:20px; font-weight:bold">(Count:${g.count})</style></div>
                <div class="range-numbers">${rText}</div>
            </div>`;
    });

    // 3. Vector-ready HTML output
    const card = `
        <div class="class-card">
            <div class="class-header">
                <div class="header-main">
                    <b>Hall No. ${num}</b>
                    <b style="margin-left:20px;">Room: ________</b>
                    <b style="margin-left:20px;">${date}</b>
                    <div class="session-info">
                        <span>${session}</span>
                        <span style="font-size:10px">${time}</span>
                    </div>
                </div>
                <b>Str: ${chunk.length}</b>
            </div>
            <div class="card-body">${bodyHtml}</div>
        </div>`;
    
    output.innerHTML += card;
}

    function renderMasterTable(list, size) {
    const output = document.getElementById('dynamicOutput');
    const examName = document.getElementById('examName').value;
    const examScheme = document.getElementById('examScheme').value;
    const examSession = document.getElementById('examSession').value;
    const examYear = document.getElementById('examYear').value;
    
    // Get Date/Time from the first record in the list
    const scheduledDateTime = list.length > 0 ? list[0].dateTime : "";
    
    const fullTitle = `${examName} (${examScheme}) Examination, ${examSession} ${examYear}`;

    let html = `
        <div style="text-align:center; margin-bottom:15px;">
            <h3 style="margin:0; text-transform:uppercase;">${fullTitle}</h3>
            <h4 style="margin:5px 0;">Seating Arrangement and Duty of Invigilator</h4>
            <h4 style="margin:5px 0; font-weight: bold;">Date & Time: ${scheduledDateTime}</h4>
        </div>
        <table class="master-table">
            <thead>
                <tr>
                    <th class="col-hall">Hall</th>
                    <th class="col-paper">Subject / Paper</th>
                    <th class="col-regs-master">Register Numbers</th>
                    <th class="col-str">Str</th>
                    <th class="col-inv">Invigilator</th>
                    <th class="col-sign">Sign</th>
                </tr>
            </thead>
            <tbody>`;
        
    for (let i = 0, hCount = 1; i < list.length; i += size, hCount++) {
        const chunk = list.slice(i, i + size);
        let subGroups = [];
        chunk.forEach(item => {
            if (subGroups.length === 0 || subGroups[subGroups.length-1].paper !== item.paper) {
                subGroups.push({ paper: item.paper, ids: [item.id] });
            } else {
                subGroups[subGroups.length-1].ids.push(item.id);
            }
        });

        subGroups.forEach((group, gIdx) => {
            html += `<tr>`;
            if (gIdx === 0) {
                html += `<td class="col-hall" rowspan="${subGroups.length}" style="text-align:center">${hCount}</td>`;
            }
            html += `<td class="col-paper" style="text-align:left; font-size:11px">${group.paper}</td>`;
            html += `<td class="col-regs-master">${formatRangesForMaster(group.ids)}</td>`;
            if (gIdx === 0) {
                html += `<td class="col-str" rowspan="${subGroups.length}" style="text-align:center">${chunk.length}</td>`;
                html += `<td rowspan="${subGroups.length}"><div class="dotted-line"></div></td>`;
                html += `<td rowspan="${subGroups.length}"><div class="dotted-line"></div></td>`;
            }
            html += `</tr>`;
        });
    }
    output.innerHTML = html + `</tbody></table>`;
}

    function formatRangesForMaster(ids) {
        let ranges = [];
        let i = 0;
        let prefixes = new Set();
        while (i < ids.length) {
            let start = parseId(ids[i]), last = start;
            while (i + 1 < ids.length) {
                let next = parseId(ids[i+1]);
                if (next.prefix === last.prefix && next.val === last.val + 1) { last = next; i++; } else break;
            }
            ranges.push({start, last}); i++;
        }
        return ranges.map(r => {
            let p = !prefixes.has(r.start.prefix); if(r.start.prefix) prefixes.add(r.start.prefix);
            let s = p ? (r.start.prefix + r.start.num) : r.start.num;
            return (r.start.num === r.last.num) ? s : s + "-" + (r.last.num.slice(-3));
        }).join(', ');
    }

    function renderStickers(list) {
        const output = document.getElementById('dynamicOutput');
        const grid = document.createElement('div');
        grid.className = 'sticker-grid';
        list.forEach(item => {
            const s = document.createElement('div');
            s.className = 'sticker';
            s.innerText = String(item.id).trim();
            grid.appendChild(s);
        });
        output.appendChild(grid);
    }
    function renderHallSummary(list, size) {
    const output = document.getElementById('dynamicOutput');
    const examName = document.getElementById('examName').value;
    const year = document.getElementById('examYear').value;

    const scheduledDateTime = list.length > 0 ? list[0].dateTime : "";

    let html = `
        <div style="text-align:center; margin-bottom:20px;">
            <h2 style="margin:0;">HALL-WISE SUMMARY</h2>
            <h4 style="margin:5px 0;">${examName} Examination ${year}</h4>
             <h4 style="margin:5px 0; font-weight: bold;">Date & Time: ${scheduledDateTime}</h4>

        </div>
        <table class="master-table" style="width: 80%; margin: 0 auto;">
            <thead>
                <tr>
                    <th style="width: 5%;">Hall No.</th>
                    <th style="width: 80%;">Register Numbers</th>
                    <th style="width: auto;">Strength</th>
                </tr>
            </thead>
            <tbody>`;

    for (let i = 0, hCount = 1; i < list.length; i += size, hCount++) {
        const chunk = list.slice(i, i + size);
        
        // Use your existing range formatting logic
        const regNumbers = formatRangesForMaster(chunk.map(s => s.id));

        html += `
            <tr style="height: 10px;">
                <td style="text-align:center; font-size: 11px; font-weight: bold;">${hCount}</td>
                <td style="padding: 4px; font-size: 11px;">${regNumbers}</td>
                <td style="text-align:center; font-size: 11px; font-weight: bold;">${chunk.length}</td>
            </tr>`;
    }

    html += `</tbody></table>`;
    
    // Add a signature line at the bottom
    html += `
        <div style="margin-top: 50px; text-align: right; padding-right: 10%; font-weight: bold;">
           
        </div>`;

    output.innerHTML = html;
}

    function downloadPDF() {
    // Corrected IDs to match your HTML elements
    const semester = document.getElementById('examName').value; 
    const session = document.getElementById('examSession').value;
    const year = document.getElementById('examYear').value;
    
    
    // Create a clean filename: e.g., First_Semester_November_2026
    const fileName = `${semester}_${session}_${year}`.replace(/\s+/g, '_');

    const originalTitle = document.title;
    document.title = fileName;

    window.print();

    setTimeout(() => { document.title = originalTitle; }, 100);
}

</script>
</body>
</html>
